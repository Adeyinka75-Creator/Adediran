<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bankBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="600" height="360" fill="url(#bankBg)" />

  <!-- App Window Frame -->
  <rect x="20" y="16" width="560" height="328" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Browser Chrome -->
  <rect x="20" y="16" width="560" height="36" rx="12" fill="#131e36" />
  <circle cx="42" cy="34" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="58" cy="34" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="74" cy="34" r="5" fill="#10b981" opacity="0.8" />
  <rect x="110" y="24" width="280" height="20" rx="6" fill="#0b1120" />
  <text x="125" y="38" fill="#64748b" font-family="monospace" font-size="11">digital-landing-page-two.vercel.app</text>

  <!-- Left: Digital Banking Card & Balance -->
  <g transform="translate(44, 76)">
    <!-- Credit Card Visual -->
    <rect width="250" height="150" rx="12" fill="url(#cardGradient)" filter="drop-shadow(0 10px 15px rgba(37,99,235,0.3))" />
    <rect x="20" y="20" width="36" height="26" rx="4" fill="#fbbf24" opacity="0.9" />
    <!-- Chip details -->
    <line x1="38" y1="20" x2="38" y2="46" stroke="#d97706" stroke-width="1" />
    <line x1="20" y1="33" x2="56" y2="33" stroke="#d97706" stroke-width="1" />
    <text x="195" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">BANK</text>
    <text x="20" y="100" fill="#ffffff" font-family="monospace" font-size="14" letter-spacing="2">•••• •••• •••• 4289</text>
    <text x="20" y="132" fill="#93c5fd" font-family="sans-serif" font-size="10">CARDHOLDER</text>
    <text x="180" y="132" fill="#93c5fd" font-family="sans-serif" font-size="10">EXP: 08/29</text>
    
    <!-- Balance Stat block underneath -->
    <rect y="165" width="250" height="75" rx="8" fill="#131e36" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="190" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Portfolio Value</text>
    <text x="16" y="220" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">$48,920.50</text>
    <rect x="165" y="198" width="70" height="24" rx="12" fill="url(#emeraldGrad)" />
    <text x="178" y="214" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">+14.2% ↑</text>
  </g>

  <!-- Right: Activity Graph and Transactions -->
  <g transform="translate(315, 76)">
    <!-- Analytics preview -->
    <rect width="240" height="135" rx="8" fill="#131e36" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Weekly Cash Flow</text>
    
    <!-- Sparkline / Trendline -->
    <path d="M 20 100 Q 60 40 100 80 T 170 50 T 225 35" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="225" cy="35" r="5" fill="#38bdf8" />
    <!-- Grid dotted lines -->
    <line x1="20" y1="110" x2="225" y2="110" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="20" y1="70" x2="225" y2="70" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Recent transfer row -->
    <g transform="translate(0, 150)">
      <rect width="240" height="90" rx="8" fill="#131e36" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Recent Activity</text>
      <!-- Row 1 -->
      <circle cx="28" cy="52" r="12" fill="#1e293b" />
      <text x="24" y="56" fill="#38bdf8" font-family="sans-serif" font-size="10">⚡</text>
      <text x="48" y="52" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="500">Stripe Payout</text>
      <text x="48" y="65" fill="#64748b" font-family="sans-serif" font-size="9">Today, 2:45 PM</text>
      <text x="175" y="54" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">+$2,450.00</text>
    </g>
  </g>
</svg>
