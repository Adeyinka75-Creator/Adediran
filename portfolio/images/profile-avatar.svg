<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d5524" />
      <stop offset="100%" stop-color="#6b3e18" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background frame -->
  <rect width="400" height="400" rx="32" fill="url(#bgGradient)" />
  <circle cx="200" cy="200" r="180" fill="url(#ringGlow)" />
  <circle cx="200" cy="200" r="160" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Abstract Code Glow elements in background -->
  <path d="M 60 140 L 40 160 L 60 180" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 340 140 L 360 160 L 340 180" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <text x="50" y="270" fill="#64748b" font-family="monospace" font-size="14" opacity="0.4">&lt;dev/&gt;</text>
  <text x="310" y="270" fill="#64748b" font-family="monospace" font-size="14" opacity="0.4">{UI/UX}</text>

  <!-- Developer Silhouette / Illustration -->
  <!-- Shoulders & Torso -->
  <path d="M 100 370 C 100 300, 140 280, 200 280 C 260 280, 300 300, 300 370 Z" fill="url(#shirtGrad)" />
  <!-- Jacket / Collar Details -->
  <path d="M 160 285 L 200 340 L 240 285" fill="#0f172a" opacity="0.8" />
  <path d="M 200 340 L 200 380" stroke="#38bdf8" stroke-width="2" opacity="0.7" />

  <!-- Neck -->
  <rect x="175" y="235" width="50" height="55" rx="8" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="65" ry="78" fill="url(#skinGrad)" />

  <!-- Hair -->
  <path d="M 132 170 C 132 105, 160 90, 200 90 C 240 90, 268 105, 268 170 C 260 135, 240 115, 200 115 C 160 115, 140 135, 132 170 Z" fill="#111827" />

  <!-- Modern Glasses -->
  <rect x="150" y="162" width="40" height="28" rx="7" fill="none" stroke="#38bdf8" stroke-width="3" />
  <rect x="210" y="162" width="40" height="28" rx="7" fill="none" stroke="#38bdf8" stroke-width="3" />
  <line x1="190" y1="174" x2="210" y2="174" stroke="#38bdf8" stroke-width="3" />
  <line x1="135" y1="172" x2="150" y2="172" stroke="#38bdf8" stroke-width="2" />
  <line x1="250" y1="172" x2="265" y2="172" stroke="#38bdf8" stroke-width="2" />

  <!-- Eyes behind glasses -->
  <circle cx="170" cy="176" r="5" fill="#ffffff" />
  <circle cx="171" cy="176" r="3" fill="#1e293b" />
  <circle cx="230" cy="176" r="5" fill="#ffffff" />
  <circle cx="231" cy="176" r="3" fill="#1e293b" />

  <!-- Nose -->
  <path d="M 197 190 Q 200 206 205 206" stroke="#4a2608" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Smile -->
  <path d="M 185 220 Q 200 230 215 220" stroke="#f8fafc" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Over-Ear Studio Headphones -->
  <path d="M 130 175 C 120 175 118 130 200 120 C 282 130 280 175 270 175" fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round" />
  <rect x="122" y="160" width="16" height="42" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <rect x="262" y="160" width="16" height="42" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />

  <!-- Status Badge at Bottom -->
  <g transform="translate(110, 335)">
    <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="22" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">OPEN TO WORK</text>
  </g>
</svg>
